services:
  shop-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopapi
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local-password
    volumes:
      - shop-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U shop -d shopapi']
      interval: 2s
      timeout: 3s
      retries: 30

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth-local-password
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U auth -d auth_db']
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    build: ./AuthService
    environment:
      AUTH_DB_DSN: postgres://auth:auth-local-password@auth-db:5432/auth_db?sslmode=disable
      AUTH_GRPC_ADDR: 0.0.0.0:50051
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in src/.env (at least 32 bytes)}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-1h}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: on-failure

  shop:
    build: ./ShopAPI
    environment:
      PORT: '8080'
      DB_HOST: shop-db
      DB_USER: shop
      DB_PASSWORD: shop-local-password
      DB_NAME: shopapi
      DB_MIGRATE: 'true'
      AUTH_GRPC_ADDR: auth:50051
      GIN_MODE: release
    ports:
      - '127.0.0.1:${SHOP_PORT:-8080}:8080'
    depends_on:
      shop-db:
        condition: service_healthy
      auth:
        condition: service_started
    restart: on-failure

volumes:
  shop-data:
  auth-data:
