worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip-сжатие
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    sendfile        on;
    keepalive_timeout  65;

    # Блок балансировки
    upstream shop_backend {
        server 127.0.0.1:8080 weight=2;
        server 127.0.0.1:8081 weight=1;
        server 127.0.0.1:8082 weight=1;
    }

    # 1. Сервер для перенаправления с HTTP на HTTPS
    server {
        listen 80;
        server_name shop.local localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Основной сервер с HTTPS
    server {
        listen 443 ssl;
        server_name shop.local localhost;

        # Пути к сертификатам
        ssl_certificate     C:/nginx/ssl/shop.crt;
        ssl_certificate_key C:/nginx/ssl/shop.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Статус Nginx
        location /status {
            stub_status on;
            access_log off;
        }

        # 1. Страница Swagger UI по /api/v1/
        location = /api/v1/ {
            proxy_pass http://127.0.0.1:8080/swagger/index.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Редирект с /api/v1 (без слеша) на /api/v1/
        location = /api/v1 {
            return 301 /api/v1/;
        }

        # 3. ПЕРЕХВАТ СТАТИКИ SWAGGER
        location ~* ^/api/v1/(.*\.(js|css|png|json))$ {
            proxy_pass http://127.0.0.1:8080/swagger/$1;
            proxy_set_header Host $host;
        }

        # 4. API с балансировкой
        location /api/v1/ {
            if ($request_method = GET) {
                proxy_pass http://shop_backend;
            }
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Authentication endpoints introduced in BE4.
        location ~ ^/(register|auth|reset|change-password)$ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # pgAdmin (редирект с актуальным ключом)
        location /admin {
            return 301 http://localhost:5050/?key=b59bea63-ec18-4b65-b6fb-41a12efd0634;
        }

        # Статика с кэшированием (для всего, кроме /api)
        location / {
            root   html;
            index  index.html index.htm;
            
            # Кэширование на 30 дней (2592000 секунд)
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
